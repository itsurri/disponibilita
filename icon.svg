<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="terra" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#E27B4E"/>
      <stop offset="55%" stop-color="#C75B3C"/>
      <stop offset="100%" stop-color="#8E3A22"/>
    </linearGradient>
    <radialGradient id="palla" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#F2FF8A"/>
      <stop offset="68%" stop-color="#DCF23A"/>
      <stop offset="100%" stop-color="#A9C400"/>
    </radialGradient>
  </defs>

  <!-- la terra rossa -->
  <rect width="512" height="512" rx="112" fill="url(#terra)"/>

  <!-- campo visto dall'alto: corridoi del doppio, righe di servizio, riga centrale -->
