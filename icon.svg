    <rect x="116" y="62" width="280" height="388"/>
    <path d="M150 62v388M362 62v388"/>
    <path d="M150 156h212M150 356h212"/>
    <path d="M256 156v200"/>
    <path d="M256 62v20M256 430v20"/>
  </g>

  <!-- la rete, coi pali che sporgono -->
  <path d="M88 256h336" stroke="#F4EDE6" stroke-width="22" stroke-linecap="round"/>

  <!-- la pallina al centro -->
  <circle cx="256" cy="256" r="52" fill="url(#palla)"/>
  <g fill="none" stroke="#1E2A08" stroke-width="8" stroke-linecap="round" opacity=".8">
    <path d="M219 221c16 21 16 49 0 70"/>
    <path d="M293 221c-16 21-16 49 0 70"/>
